<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title data-i18n="popupTitle"></title>
  <link rel="stylesheet" href="../css/popup.css" />
  <script type="module" src="../js/popup.js" defer></script>
</head>
<body>
  <!-- Header Bar -->
  <header class="popup-header">
    <div class="brand-wrapper">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      </div>
      <div class="brand-text">
        <h1 class="popup-title" data-i18n="popupTitle">Gestor de Descargas</h1>
        <div id="statusBadge" class="status-badge active">
          <span class="status-dot"></span>
          <span id="statusText">Organización Activa</span>
        </div>
      </div>
    </div>
    <div class="header-right-group">
      <label class="toggle-switch main-toggle" title="Activar/Desactivar Organización Automática">
        <input type="checkbox" id="autoOrganizeToggle">
        <span class="slider" data-on="ON" data-off="OFF"></span>
      </label>
      <div class="header-actions">
        <button id="openSidebar" class="btn-header-action" data-i18n-title="openInSidebarTooltip">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
        </button>
        <button id="openTab" class="btn-header-action" data-i18n-title="openInTabTooltip">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        </button>
        <button id="openOptions" class="btn-header-action btn-options" data-i18n-title="openSettingsTooltip">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="gear-icon"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Segmented Tab Navigation -->
  <nav class="nav-tabs-container">
    <button class="nav-tab active" data-tab="downloads">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      <span data-i18n="tabDownloads">Descargas</span>
    </button>
    <button class="nav-tab" data-tab="history">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
      <span data-i18n="tabHistory">Historial</span>
    </button>
    <button class="nav-tab" data-tab="settings">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      <span data-i18n="tabSettings">Ajustes</span>
    </button>
  </nav>

  <!-- TAB 1: DESCARGAS & ARRASTRE -->
  <div id="tab-downloads" class="tab-content active">
    <!-- Forzar descarga rápida -->
    <section class="popup-section control-panel">
      <div class="force-download-section">
        <div id="force-idle-view">
          <label for="forceFolderInput" class="force-label" data-i18n="forceDownloadLabel"></label>
          <div class="force-input-group">
            <div class="input-icon-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
              <input type="text" id="forceFolderInput" list="folder-suggestions" data-i18n-placeholder="forceDownloadPlaceholder">
            </div>
            <button id="forceNextDownloadBtn" class="btn-force">
              <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="9" y1="15" x2="15" y2="15"></line><polyline points="12 12 15 15 12 18"></polyline></svg>
              <span data-i18n="activateButton"></span>
            </button>
          </div>
          <datalist id="folder-suggestions"></datalist>
        </div>
        <div id="force-active-view" style="display: none;">
          <div class="active-mode-card">
            <div class="active-icon-pulse">
              <svg viewBox="0 0 24 24" width="24" height="24" stroke="var(--primary-color)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            </div>
            <p class="force-active-text"></p>
            <button id="cancelForceBtn" class="btn-cancel-force" data-i18n="cancelButton"></button>
          </div>
        </div>
      </div>
    </section>

    <!-- Zona de Soltado / Drop Zone -->
    <section class="popup-section dropzone-section">
      <div id="dropZone" class="drop-zone">
        <div class="drop-zone-icon">
          <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
        </div>
        <div class="drop-zone-text">
          <strong data-i18n="dropZoneTitle">Arrastra imágenes o enlaces aquí</strong>
          <span data-i18n="dropZoneSubtitle">Suelta para añadir a la cola de descargas</span>
        </div>
      </div>
    </section>

    <!-- Sección Cola de Descargas -->
    <section id="queueSection" class="popup-section queue-section" style="display: none;">
      <div class="queue-header">
        <div class="queue-title-wrapper">
          <h2 class="queue-title" data-i18n="queueTitle">Cola de Descargas</h2>
          <span id="queueBadge" class="queue-badge">0</span>
        </div>
        <div class="queue-actions">
          <button id="downloadAllQueueBtn" class="btn-queue-action btn-download-all" data-i18n="downloadAllButton">Descargar Todas</button>
          <button id="clearQueueBtn" class="btn-queue-action btn-clear-queue" data-i18n="clearQueueButton">Vaciar</button>
        </div>
      </div>
      <ul id="queueList" class="queue-list"></ul>
    </section>
  </div>

  <!-- TAB 2: HISTORIAL -->
  <div id="tab-history" class="tab-content" style="display: none;">
    <section class="popup-section history-section">
      <div class="history-content">
        <p id="downloadCount" class="download-count"></p>
        <ul id="popupHistory" class="popup-history">
          <li><i data-i18n="loadingHistory"></i></li>
        </ul>
      </div>
    </section>
  </div>

  <!-- TAB 3: AJUSTES RÁPIDOS -->
  <div id="tab-settings" class="tab-content" style="display: none;">
    <section class="popup-section settings-tab-section">
      <div class="settings-card">
        <div class="drag-target-selector">
          <label class="drag-target-label" data-i18n="dragTargetLabel">Guardar arrastrados en:</label>
          <div class="drag-target-controls">
            <select id="dragTargetMode" class="drag-target-select">
              <option value="auto" data-i18n="dragTargetAuto">Automático (Reglas)</option>
              <option value="custom" data-i18n="dragTargetCustom">Carpeta Aparte</option>
            </select>
            <input type="text" id="dragCustomFolderInput" class="drag-custom-folder-input" data-i18n-placeholder="dragFolderPlaceholder" style="display: none;" />
          </div>
        </div>
      </div>

      <div class="settings-card settings-link-card">
        <button id="openFullOptionsBtn" class="btn-full-options">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          <span data-i18n="openSettingsTooltip">Abrir Configuración Avanzada</span>
        </button>
      </div>
    </div>
  </div>

</body>
</html>
